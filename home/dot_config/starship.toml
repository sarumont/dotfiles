# Two-line prompt with contextual modules; styling from Omarchy's config
# (ANSI cyan, so it follows the Omarchy/terminal theme).
add_newline = true
command_timeout = 200

format = """\
    $username\
    $hostname\
    $directory\
    $git_branch\
    $git_state\
    $git_status\
    $package\
    $dotnet\
    $golang\
    $java\
    $nodejs\
    $python\
    $ruby\
    $rust\
    $nix_shell\
    $conda\
    $aws\
    $kubernetes\
    $gcloud\
    $env_var\
    $cmd_duration\
    $line_break\
    $jobs\
    $battery\
    $character\
"""

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$symbol$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status$ahead_behind]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '

[env_var.PGDATABASE]
format = '$symbol [$env_value]($style) '
symbol = ''
style = 'grey bold'

[gcloud]
format = '[$symbol$project]($style) '
style = 'bold yellow'
