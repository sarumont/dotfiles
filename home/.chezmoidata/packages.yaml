# Installed by .chezmoiscripts/run_onchange_before_10-install-packages.sh.tmpl,
# which re-runs whenever this file changes. Linux uses `yay -S --needed`;
# macOS uses Homebrew only.
packages:
  # every Linux machine, desktop or server (CLI only)
  linux:
    - inetutils        # `hostname` (scripts use `hostname -s`; not in base)
    - ghq              # clones to ~/github.com/<owner>/<repo> ($REPO_ROOT)
    - zsh
    - oh-my-zsh-git
    - zsh-syntax-highlighting
    - chezmoi
    - difftastic
    - sd
    - go-yq
    - yamllint
    - direnv
    - httpie
    - hexyl
  # Linux desktops only (.desktop): GUI apps, fonts, input remapping, and
  # workstation tooling a server doesn't need
  linux_desktop:
    - ctags            # universal-ctags, for zoekt symbol ranking
    - kubectl
    - terragrunt
    - helm
    - ghostty
    - otf-monaspace-nerd
    - silicon          # nvim-silicon (<leader>sc) screenshots
    - keyd             # Caps Lock remap, config in system/etc/keyd
  # plain Arch only: Omarchy already ships these (some under other names,
  # e.g. mise-bin, so installing them on Omarchy would conflict)
  arch_only:
    - neovim
    - tmux
    - starship
    - eza
    - bat
    - fd
    - fzf
    - ripgrep
    - zoxide
    - jq
    - lazygit
    - btop
    - mise
    # herdr: official installer (run_once_before_15-herdr) for handoff
    - tree-sitter-cli  # nvim-treesitter (main branch) compiles parsers with it
  # personal Linux desktops (.personal and .desktop): personal GUI apps
  linux_personal_desktop:
    - signal-desktop   # comms workspace; Omarchy launches it on SUPER+SHIFT+G
    - proton-pass-cli-bin  # secrets backend; servers use secrets = none
  # personal Linux machines, desktop or server (.personal)
  linux_personal:
    - syncthing
    - tailscale
  # macOS Homebrew formulae; runtimes and CLI tools from mise stay there
  darwin_brew:
    - aichat
    - bat
    - btop
    - cmake
    - coreutils
    - chezmoi
    - difftastic
    - delve
    - sd
    - eza
    - fd
    - ffmpeg
    - fzf
    - gnupg
    - gotop
    - hexyl
    - universal-ctags
    - zsh-syntax-highlighting
    - tree-sitter-cli
    - ghq
    - direnv
    - httpie
    - kubernetes-cli
    - terragrunt
    - helm
    - jq
    - jwt-cli
    - k9s
    - keychain
    - mise
    - lazydocker
    - luarocks
    - neovim
    - pam-reattach
    - pandoc
    - pwgen
    - ripgrep
    - silicon
    - starship
    - stylua
    - tmux
    - watch
    - wget
    - yq
    - zoxide
    - python@3.11  # Python host for Neovim's pynvim provider
  darwin_cask:
    - android-platform-tools
    - ghostty
    - font-monaspace-nerd-font
    - 1password-cli
  darwin_personal_cask:
    - syncthing
    - tailscale
