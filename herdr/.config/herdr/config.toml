onboarding = false

[keys]
prefix = "ctrl+a"

# status-bar toggle equivalent (tmux: bind-key s set-option status)
# settings moved off 's' to make room
toggle_sidebar = "prefix+s"
settings = "prefix+shift+s"

# match vanilla tmux detach (prefix+d); herdr defaults to prefix+q
detach = "prefix+d"

# last-session toggle (tmux: bind C-b / C-B switch-client -l)
# ctrl+b is free now that prefix moved to ctrl+a
previous_workspace = "prefix+ctrl+b"

# Workspace navigation is handled by the fzf popup below.
navigate_workspace_up = "k"
navigate_workspace_down = "j"

# Tab switching: both prefix+1..9 and direct macOS cmd+1..9.
switch_tab = "prefix+1..9"

# Disable the built-in scrolling workspace picker.
workspace_picker = ""

# Workspace creation workflows
# Disable the built-in binding; prefix+shift+n uses the named-root prompt below.
new_workspace = ""

# Match tmux split keys: % creates side-by-side panes; " creates stacked panes.
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'

# Custom workspace commands
[[keys.command]]
key = "prefix+ctrl+o"
type = "popup"
command = "herdr-workspace-switch"

[[keys.command]]
key = "prefix+shift+n"
type = "popup"
command = "herdr-workspace-task"

[[keys.command]]
key = "prefix+ctrl+w"
type = "popup"
command = "herdr-workspace-pick"

[[keys.command]]
key = "prefix+shift+o"
type = "popup"
command = "herdr-agent-waiting"

# Everything else (focus_pane_h/j/k/l, zoom=z, reload_config=shift+r)
# already matches the tmux config's intent under herdr's defaults — left unset.

[keys.indexed]
tabs = "cmd"

[ui]
# skip the name prompt when creating a tab (prefix+c); auto-generate instead
prompt_new_tab_name = false

# Show one custom Git-status row per repository in task workspaces.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  ["$repo_01_status", { token = "$repo_01_sync", fg = "#f38ba8" }],
  ["$repo_02_status", { token = "$repo_02_sync", fg = "#f38ba8" }],
  ["$repo_03_status", { token = "$repo_03_sync", fg = "#f38ba8" }],
  ["$repo_04_status", { token = "$repo_04_sync", fg = "#f38ba8" }],
  ["$repo_05_status", { token = "$repo_05_sync", fg = "#f38ba8" }],
  ["$repo_06_status", { token = "$repo_06_sync", fg = "#f38ba8" }],
  ["$repo_07_status", { token = "$repo_07_sync", fg = "#f38ba8" }],
  ["$repo_08_status", { token = "$repo_08_sync", fg = "#f38ba8" }],
  ["$repo_09_status", { token = "$repo_09_sync", fg = "#f38ba8" }],
  ["$repo_10_status", { token = "$repo_10_sync", fg = "#f38ba8" }],
  ["$repo_11_status", { token = "$repo_11_sync", fg = "#f38ba8" }],
  ["$repo_12_status", { token = "$repo_12_sync", fg = "#f38ba8" }],
  ["$repo_13_status", { token = "$repo_13_sync", fg = "#f38ba8" }],
  ["$repo_14_status", { token = "$repo_14_sync", fg = "#f38ba8" }],
]

[theme]
name = "one-dark"
auto_switch = false
