import:
    copy: no
    move: yes
    incremental: yes

threaded: yes
clutter: [ "Thumbs.DB", ".DS_Store", "*.m3u", "*.txt" ]

plugins: lastgenre inline info fetchart web mbsync thumbnails lyrics xtractor copyartifacts plexupdate
format_item: "$artist - $album - $title [$genre] [$format] [$samplerate/$bitdepth]"

ui:
    color: yes

copyartifacts:
    extensions: .pdf .log .cue .toc
    print_ignored: yes

lastgenre:
    canonical: ''
    source: artist

per_disc_numbering: true

item_fields:
    multidisk: 1 if disctotal > 1 else 0

paths:
    albumtype:soundtrack: %asciify{Soundtracks/$album/$track $title}
    singleton: %asciify{Singletons/$artist - $title}
    comp: %asciify{$genre/$album/$track $title}
    default: %asciify{$genre/$albumartist/$album%aunique{}/%if{$multidisk,CD${disc}/}$track $title}
    ext:log: $albumpath/$artist - $album
    ext:cue: $albumpath/$artist - $album
    ext:toc: $albumpath/$artist - $album
    ext:pdf: $albumpath/liner

thumbnails:
    auto: yes

lyrics:
    auto: yes
